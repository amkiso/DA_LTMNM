services:
  db:
    image: mysql:8.4
    container_name: quanlythuvien-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-quanlythuvien}
      MYSQL_USER: ${DB_USERNAME:-thuvien}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanlythuvien-app:latest
    container_name: quanlythuvien-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: quanlythuvien-app:latest
    container_name: quanlythuvien-scheduler
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  storage_public:
  storage_logs:
